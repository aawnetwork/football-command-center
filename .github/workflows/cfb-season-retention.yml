name: Retain completed CFB weeks
on:
  schedule:
    - cron: '15 12 * 8-12 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cfb-season-retention
  cancel-in-progress: false
jobs:
  retain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recover every missing completed week into a private candidate
        run: node scripts/cfb-season-retain.mjs "$RUNNER_TEMP/cfb-retention"
      - name: Apply only a fully validated pair to this checkout
        run: |
          if [ -f "$RUNNER_TEMP/cfb-retention/retention-review.json" ]; then
            cp "$RUNNER_TEMP/cfb-retention/cfb-player-history.json" app/lib/stats-v2/
            cp "$RUNNER_TEMP/cfb-retention/cfb-season-metadata.json" app/lib/stats-v2/
          fi
      - name: Validate the candidate
        run: |
          node --test tests/cfb-season*.test.mjs tests/cfb-stats-v2.test.mjs
          npx next typegen
          npx tsc --noEmit
      - name: Retain original evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-season-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/cfb-retention
          retention-days: 90
          if-no-files-found: error
      - name: Publish validated stats and request a production build
        env:
          DEPLOY_HOOK: ${{ secrets.CFB_STATS_VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          history=app/lib/stats-v2/cfb-player-history.json
          metadata=app/lib/stats-v2/cfb-season-metadata.json
          week=$(jq -er '.throughWeek' "$metadata")
          live_week=$(curl -fsS --max-time 60 'https://hub.aawnetwork.co.uk/api/cfb/stats-v2?mode=season&category=QB' |
            jq -er '.throughWeek | numbers' || true)

          if git diff --quiet -- "$history" "$metadata" && [[ -n "$live_week" ]] && (( live_week >= week )); then
            echo "Production already serves verified totals through Week $live_week."
            exit 0
          fi

          if [[ "$DEPLOY_HOOK" != https://api.vercel.com/v1/integrations/deploy/* ]]; then
            echo "::error::Configure CFB_STATS_VERCEL_DEPLOY_HOOK as a GitHub Actions secret for the production main branch."
            exit 1
          fi

          if ! git diff --quiet -- "$history" "$metadata"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$history" "$metadata"
            git commit -m "Retain verified CFB player stats through Week $week"
            git push origin HEAD:refs/heads/main
          fi

          curl -fsS --max-time 30 -X POST "$DEPLOY_HOOK" | jq -e '.job.id | strings' >/dev/null
          for attempt in {1..24}; do
            sleep 15
            live_week=$(curl -fsS --max-time 30 'https://hub.aawnetwork.co.uk/api/cfb/stats-v2?mode=season&category=QB' |
              jq -er '.throughWeek | numbers' || true)
            if [[ -n "$live_week" ]] && (( live_week >= week )); then
              echo "Production serves verified totals through Week $live_week."
              exit 0
            fi
          done
          echo "::error::Production did not confirm Week $week. The next scheduled run will retry publication."
          exit 1
